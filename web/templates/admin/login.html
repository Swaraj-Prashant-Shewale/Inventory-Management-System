{% extends "base.html" %}
{% block title %}Platform admin{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card single">
    <form method="post" action="/admin/login" class="auth-form">
      <h2>Platform administration</h2>
      <p class="muted">Operator sign-in — not for client companies.</p>
      <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
      {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
      <label>Username
        <input type="text" name="username" value="{{ username|default('') }}" autofocus required>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <label>Authentication code
        <input type="text" name="totp" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]*" placeholder="only if 2FA is enabled">
      </label>
      <button type="submit" class="btn primary wide">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
