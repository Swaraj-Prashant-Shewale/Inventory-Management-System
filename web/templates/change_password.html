{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card single">
    <form method="post" action="/account/password" class="auth-form">
      <h2>Choose a new password</h2>
      {% if forced %}
      <p class="muted">Your password was set by an administrator, so it must be
        changed before you can continue.</p>
      {% endif %}
      {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <label>Current password
        <input type="password" name="current" autocomplete="current-password" required autofocus>
      </label>
      <label>New password (at least 8 characters)
        <input type="password" name="new" autocomplete="new-password" required>
      </label>
      <label>Confirm new password
        <input type="password" name="confirm" autocomplete="new-password" required>
      </label>
      <button type="submit" class="btn primary wide">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
